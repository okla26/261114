<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多 AI 投資競賽｜互動分析報告 (2026-11-11 ~ 11-14)</title>
<style>
:root{
  --bg:#f4f5f7;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --shadow:0 4px 20px rgba(15,23,42,.05);
  --accent:#0f766e;
  --pos:#15803d;
  --pos-bg:#dcfce7;
  --neg:#be123c;
  --neg-bg:#ffe4e6;
  --warn:#b45309;
  --warn-bg:#fef3c7;
  --c-mm:#0d9488;
  --c-cd:#2563eb;
  --c-gr:#d97706;
  --c-ds:#e11d48;
  --c-spy:#64748b;
  --c-cash:#cbd5e1;
  --radius:14px;
}
:root[data-theme="dark"]{
  --bg:#0b1120;
  --surface:#111827;
  --surface-2:#1e293b;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --border:#263244;
  --shadow:0 6px 24px rgba(0,0,0,.35);
  --pos:#4ade80;
  --pos-bg:rgba(74,222,128,.14);
  --neg:#fb7185;
  --neg-bg:rgba(251,113,133,.14);
  --warn:#fbbf24;
  --warn-bg:rgba(251,191,36,.14);
  --c-cash:#334155;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px/1.55 "Inter",system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 48px}
header.topbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  margin:0 -18px 18px;padding:12px 18px;
}
.topbar-inner{
  max-width:1180px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-badge{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,#0d9488,#2563eb);
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;
  box-shadow:0 4px 12px rgba(13,148,136,.28);
}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
.subtitle{font-size:12px;color:var(--muted)}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill-group{
  display:inline-flex;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:3px;gap:2px;
}
.pill{
  border:0;background:transparent;color:var(--muted);
  padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;
  transition:.15s ease;
}
.pill:hover{color:var(--text)}
.pill.active{background:var(--text);color:var(--bg)}
.btn{
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:6px 11px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;transition:.15s;
}
.btn:hover{border-color:var(--muted)}
.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.grid-kpi{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid-kpi{grid-template-columns:1fr}}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
}
.kpi-label{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.kpi-val{font-size:24px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
.kpi-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
}
.tag.pos{background:var(--pos-bg);color:var(--pos);border-color:transparent}
.tag.neg{background:var(--neg-bg);color:var(--neg);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.grid-charts{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-bottom:16px}
@media(max-width:960px){.grid-charts{grid-template-columns:1fr}}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.leg-btn{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:4px 10px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);cursor:pointer;transition:.15s;
}
.leg-btn.off{opacity:.38;filter:grayscale(1)}
.chart-box{position:relative;width:100%;user-select:none}
.tooltip{
  position:absolute;pointer-events:none;z-index:20;
  background:color-mix(in srgb, var(--surface) 95%, transparent);
  backdrop-filter:blur(8px);
  border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.18);
  font-size:12px;min-width:195px;display:none;
}
.tt-head{font-weight:700;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.tt-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:3px 0}

.market-strip{
  display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;
  margin-bottom:16px;padding:12px 16px;
}
@media(max-width:820px){.market-strip{grid-template-columns:1fr}}
.etf-pills{display:flex;gap:8px;flex-wrap:wrap}
.etf-chip{
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:6px 10px;min-width:108px;
}
.etf-chip .sym{font-size:11px;font-weight:700;color:var(--muted)}
.etf-chip .px{font-size:14px;font-weight:700;display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.event-line{font-size:13px;color:var(--text)}
.event-line strong{color:var(--accent)}

.section-title{
  font-size:15px;font-weight:800;margin:20px 0 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
}
.grid-ai{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}
@media(max-width:840px){.grid-ai{grid-template-columns:1fr}}
.ai-card{
  position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;
  border-top:3px solid var(--ai-color,var(--accent));
}
.ai-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ai-id{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.rank-badge{
  font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;
  background:var(--surface-2);border:1px solid var(--border);
}
.rank-1{background:#fef3c7;color:#92400e;border-color:#fde68a}
:root[data-theme="dark"] .rank-1{background:rgba(251,191,36,.18);color:#fcd34d;border-color:rgba(251,191,36,.35)}
.ai-metrics{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  background:var(--surface-2);border-radius:10px;padding:8px 10px;
}
.ai-m{display:flex;flex-direction:column}
.ai-m span{font-size:11px;color:var(--muted)}
.ai-m strong{font-size:13px;font-weight:700}
.ai-points{margin:0;padding-left:16px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.ai-points li::marker{color:var(--ai-color)}
.ai-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px;border-top:1px dashed var(--border);flex-wrap:wrap}
.action-seq{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.act-dot{padding:1px 6px;border-radius:5px;font-weight:700;border:1px solid var(--border);background:var(--surface-2)}
.act-dot.adj{color:#2563eb;border-color:rgba(37,99,235,.35);background:rgba(37,99,235,.08)}

.matrix-list{display:flex;flex-direction:column;gap:10px}
.matrix-row{
  border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-2);
  display:grid;grid-template-columns:130px 1fr auto;gap:14px;align-items:center;
}
@media(max-width:780px){.matrix-row{grid-template-columns:1fr;gap:8px}}
.alloc-bar{
  height:24px;border-radius:7px;overflow:hidden;display:flex;
  background:var(--border);border:1px solid var(--border);margin-bottom:6px;
}
.alloc-seg{
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;
  transition:width .25s ease;
}
.alloc-seg.cash{color:var(--text);background:var(--c-cash)}
.alloc-meta{font-size:12px;color:var(--text);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.audit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:780px){.audit-grid{grid-template-columns:1fr}}
.audit-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13px}
.audit-list li{display:flex;align-items:flex-start;gap:8px}

/* Modal */
dialog{
  width:min(820px,94vw);max-height:86vh;border:1px solid var(--border);
  border-radius:16px;padding:0;background:var(--surface);color:var(--text);
  box-shadow:0 24px 60px rgba(0,0,0,.35);
}
dialog::backdrop{background:rgba(2,6,23,.55);backdrop-filter:blur(4px)}
.modal-head{
  position:sticky;top:0;background:var(--surface);z-index:2;
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.modal-body{padding:16px 18px;overflow-y:auto;max-height:calc(86vh - 60px)}
.round-block{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--surface-2)}
details summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.raw-txt{font-size:12px;white-space:pre-wrap;color:var(--muted);margin:6px 0 0;line-height:1.55}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-badge">AI</div>
      <div>
        <h1>多 AI 投資競賽｜互動分析報告</h1>
        <div class="subtitle" id="sub-range">載入中...</div>
      </div>
    </div>
    <div class="controls">
      <div class="pill-group" id="round-pills"></div>
      <label class="btn" title="可匯入其他回合 JSON 檔即時分析">

        <input type="file" id="file-in" accept=".json,.txt" hidden>
      </label>
      <button class="btn" id="theme-btn" title="切換深淺色">🌓 主題</button>
    </div>
  </div>
</header>

<div class="wrap">
  <!-- KPI Strip -->
  <div class="grid-kpi" id="kpi-row"></div>

  <!-- Charts -->
  <div class="grid-charts">
    <div class="card">
      <div class="card-head">
        <h2 class="card-title">淨值走勢 vs. SPY 基準</h2>
        <div class="legend" id="chart-legend"></div>
      </div>
      <div class="chart-box" id="line-wrap">
        <svg id="line-svg" viewBox="0 0 680 290" style="width:100%;height:auto;display:block"></svg>
        <div class="tooltip" id="line-tt"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 class="card-title">風險・回撤・槓桿對比</h2>
        <div class="pill-group" id="subchart-tabs">
          <button class="pill active" data-tab="risk">報酬 vs 回撤</button>
          <button class="pill" data-tab="exp">曝險 &amp; 現金</button>
        </div>
      </div>
      <div class="chart-box">
        <svg id="bar-svg" viewBox="0 0 440 290" style="width:100%;height:auto;display:block"></svg>
      </div>
    </div>
  </div>

  <!-- Market Snapshot -->
  <div class="card market-strip" id="market-strip"></div>

  <!-- 4 AI Executive Cards -->
  <div class="section-title">
    <span>參賽 AI 戰力總評（依規則最終淨值排序）</span>
    <span class="subtitle">點擊「回合明細」可查閱各輪重點與原始事實/判斷</span>
  </div>
  <div class="grid-ai" id="ai-grid"></div>

  <!-- Interactive Round Allocation Matrix -->
  <div class="card">
    <div class="card-head">
      <h2 class="card-title" id="matrix-title">逐回合持倉結構與調倉重點</h2>
      <div class="pill-group" id="matrix-tabs"></div>
    </div>
    <div class="matrix-list" id="matrix-list"></div>
  </div>

  <!-- Compliance & Audit -->
  <div class="section-title"><span>規則合規與資料健檢（對照《規則 v2.0》）</span></div>
  <div class="audit-grid" id="audit-grid"></div>
</div>

<dialog id="detail-modal">
  <div class="modal-head">
    <strong id="modal-title">AI 明細</strong>
    <button class="btn" id="modal-close">✕ 關閉</button>
  </div>
  <div class="modal-body" id="modal-body"></div>

0%、Naver -5.12%、KEPCO -9.79%（第三季財報不佳），KOSDAQ +0.45%至699.66；日經 +0.53%至61,142.35、匯率走弱突破160。美國銀行指出押注亞洲股市空頭有風險，台灣啟動穩定基金、韓國則放寬券商保證金融資條件以抑制強制賣出，並指Nvidia 11/17財報是下一個重要需求測試。6. 台灣政策與指數（延續）：國家穩定基金規模擬倍增至1兆，放空管制（當沖賣空上限3%）與130%保證金比率自11/9維持；MSCI 11/30盤後生效的台股權重上調（全球3.25%→3.28%、新興市場28.86%→29.01%、亞洲除日本32.72%→32.83%）。7. 結算與規則面：依本回合價格，我的三個部位合計4,896.27、現金5,000.02，總值9,896.29，現金占50.52%，已高於規則規定的50%上限，因此本回合必須把現金投回2倍槓桿部位。目前無法確認：11/13收盤的VIX數值、11/14亞洲盤勢（決策時點未開盤）、Nvidia永久執行長人選、2倍商品當日成交量與滑價。","judgment":"這回合有兩件事必須分開處理：規則面與觀點面。規則面：我的現金緩衝原本就設在50%上限，經過這次標普與原型的回落，現金占調倉後總值已被推到50.52%，也就是說框架在這個時點「要求」我把一部分現金投回2倍槓桿部位——這是規則驅動，不是情緒驅動，也不是因為我想追高。觀點面：需求端沒有被破壞，被破壞的是價格支撐的原因。需求端仍在上修（Applied Materials設備業務預期2027年再增30%以上並點名先進邏輯、DRAM與先進封裝帶動2030年前約75%的成長，Cisco本財年AI基礎建設營收約90億並上調財測，Nebius把2027年資本支出拉到400至450億，台積電是Anthropic 260億私募部位的基石之一，CoreWeave在手訂單132.5億），但價格端連兩日被Nvidia壓住（連跌兩日、盤中為2025年6月以來最低，費半單日 -4%），而且「好消息不再被獎勵」：Cisco優於預期卻跌6%、Nebius跌16%。這說明目前壓縮估值的不是需求，而是三件事：(a) Nvidia永久接班人未定，董事會主席改由Harvey Jones出任，且出口管制風險被國會正式調查（H200對中銷售許可、Megaspeed調查中止、國會可能加碼出口限制、中國AI股同步走弱），這是我無法用更多槓桿解決的；(b)利率路徑更緊，10年期已到5.13-5.15%、PPI年增6.5%為2022年11月以來最高、12月升息定價100%且升50個基點仍有約11-14%、1月也是活會議；(c)台韓資金面分歧，台灣外資賣壓收斂（11/12僅淨賣約6.85億）、本週結束連4週下跌且台積電與MediaTek走強，韓國則外資在11/13轉為淨賣703.3億、SK hynix遭外資淨賣471.4億。所以結論是：滿足規則的方式要選「提升曝險品質」而不是「加碼我最依賴的腿」。我的三條AI腿已抵達或逼近上限（QQQ占24.78%、台灣加韓國合計24.70%），規則內唯一還有空間的是SPY*2；我選它有四個理由：第一，我的帳戶目前100%曝險在AI供應鏈群，而每日損益的驅動已轉為Nvidia接班與出口政策加上利率路徑，SPY*2把單一主題風險攤薄；第二，標普波動低於那斯達克100與亞洲半導體，2倍結構下每日重置的路徑耗損更小、距離「原型跌50%即本金歸零」的距離更遠；第三，當前相對強勢的是金融、醫療與能源（11/13道瓊僅跌0.23%、Apple創市值新高、KB Financial +4.74%、油價因荷姆茲與中東風險維持高檔），SPY*2正好承接「利率更高＋能源地緣溢價」這個我原本完全沒有曝險的狀態；第四，名目曝險從總資產的約99%升到約109%，讓我在廣泛反彈時不必完全缺席。我沒有把這筆錢加在AI腿上，即使我對台灣最有信心：台灣加韓國已達24.70%，再加就破我自己的25%上限。我也沒有把任何腿從2倍升到3倍去追名次——費半單日 -4%、好牌不漲的環境還沒結束，3倍在這種波動下等於送出本金；本回合3倍亞洲組合的最大回撤是8.88%，我的帳戶是3.92%，2倍上限在這種波動裡賺到的正是「不必在最差的一刻被強平」。我沒有減任何一條AI腿：減碼條件（跌破11/6低點且外資續淨賣）不成立——加權指數43,675較11/6收盤39,702高約10%、本週結束連4週下跌、外資賣壓趨緩、國家穩定基金擬倍增至1兆；KOSPI雖弱但仍在11/6收盤5,060之上。且三條腿目前都低於原始本金（QQQ -1.9%、EWT -0.5%、EWY -4.8%），帳面虧損不是賣出理由，我不為了虧損砍倉、也不為了甩掉雜訊而換手。最後一點是心態：我暫居 const fmt = (n, d = 2) => Number(n).toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtPct = (n, d = 2) => (n >= 0 ? "+" : "") + fmt(n * 100, d) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function computeModel(data) {
  const rounds = data.rounds || [];
  const ids = data.ids || [];
  if (!rounds.length) return null;
  const baseSpy = rounds[0].prices.SPY;
  const series = {};
  ids.forEach(id => {
    series[id] = [];
    let peak = 10000;
    let mdd = 0;
    let adjCount = 0;
    rounds.forEach((r, idx) => {
      const e = r.entries[id];
      const pos = e?.positions || [];
      const cash = e?.cash || 0;
      const principalSum = pos.reduce((s, p) => s + p.principal, 0);
      const total = cash + principalSum;
      const grossExp = pos.reduce((s, p) => s + p.principal * p.lev, 0);
      if (total > peak) peak = total;
      const dd = (total - peak) / peak;
      if (dd < mdd) mdd = dd;
      if (idx > 0 && e?.action === "調整") adjCount++;
      const spyRet = r.prices.SPY / baseSpy - 1;
      const cumRet = total / 10000 - 1;
      series[id].push({
        id,
        idx,
        date: r.date,
        total,
        cash,
        cashPct: total ? cash / total : 0,
        grossExp,
        effLev: total ? grossExp / total : 0,
        cumRet,
        spyRet,
        excess: cumRet - spyRet,
        dd,
        mdd,
        positions: pos,
        action: e?.action || "—",
        entry: e
      });
    });
    series[id].adjCount = rounds.filter(r => r.entries[id]?.action === "調整").length;
  });

  const spySeries = rounds.map((r, idx) => ({
    idx,
    date: r.date,
    total: 10000 * (r.prices.SPY / baseSpy),
    cumRet: r.prices.SPY / baseSpy - 1
  }));

  const lastIdx = rounds.length - 1;
  const standings = ids.map(id => {
    const last = series[id][lastIdx];
    const maxVal = Math.max(...series[id].map(x => x.total));
    return { id, ...last, maxVal, adjCount: series[id].adjCount };
  }).sort((a, b) => b.total - a.total);

  return { rounds, ids, series, spySeries, standings, lastIdx };
}

function getColor(id) {
  return AI_META[id]?.color || "#6366f1";
}

  const M = computeModel(RAW);

  if (STATE.matrixIdx >= M.rounds.length) STATE.matrixIdx = M.lastIdx;

  renderKPI(M);
  renderLegend(M);
  renderLineChart(M);
  renderBarChart(M);
  renderMarketStrip(M);
  renderAICards(M);
  renderMatrix(M);
  renderAudit(M);
}

  const box = document.getElementById("round-pills");

    html += `<button class="pill ${STATE.roundIdx === i ? "active" : ""}" data-r="${i}">R${i + 1} ${r.date.slice(5)}</button>`;
  });
  box.innerHTML = html;
  box.querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      const r = Number(b.dataset.r);
      STATE.roundIdx = r;
      if (r >= 0) STATE.matrixIdx = r;
      renderAll();
    };

function renderKPI(M) {
  const idx = STATE.roundIdx >= 0 ? STATE.roundIdx : M.lastIdx;
  const ranked = M.ids.map(id => M.series[id][idx]).sort((a, b) => b.total - a.total);
  const leader = ranked[0];
  const peakAI = M.ids.map(id => ({ id, max: Math.max(...M.series[id].map(x => x.total)) }))
    .sort((a, b) => b.max - a.max)[0];
  const spy = M.spySeries[idx];
  const spyPx = M.rounds[idx].prices.SPY;
  const ddRanked = [...ranked].sort((a, b) => b.mdd - a.mdd);
  const ddBest = ddRanked[0];
  const ddSecond = ddRanked[1];
  const peakRound = M.rounds.findIndex(r => {
    const vals = M.ids.map(id => M.series[id].find(x => x.date === r.date)?.total || 0);
    return Math.max(...vals) === peakAI.max;
  });

  const cards = [
    {
      label: `R${idx + 1} 領先者`,
      badge: `<span class="dot" style="background:${getColor(leader.id)}"></span>`,
      val: `${leader.id}`,
      sub: `淨值 <strong>${fmt(leader.total)}</strong> <span class="tag ${leader.cumRet >= 0 ? "pos" : "neg"}">${fmtPct(leader.cumRet)}</span>`
    },
    {
      label: "最低最大回撤 (MDD)",
      badge: `<span class="dot" style="background:${getColor(ddBest.id)}"></span>`,
      val: `${fmt(ddBest.mdd * 100)}%`,
      sub: `由 <strong>${ddBest.id}</strong> 保持 · 次佳 ${ddSecond?.id || "—"} ${fmt((ddSecond?.mdd || 0) * 100)}%`
    },
    {
      label: "全場最高峰值淨值",
      badge: `<span class="dot" style="background:${getColor(peakAI.id)}"></span>`,
      val: `${fmt(peakAI.max)}`,
      sub: `<strong>${peakAI.id}</strong> (R${peakRound + 1}) · 終局 MDD ${fmt(M.series[peakAI.id][M.lastIdx].mdd * 100)}%`
    },
    {
      label: `SPY 基準 (R${idx + 1})`,
      badge: `<span class="dot" style="background:var(--c-spy)"></span>`,
      val: `${fmt(spy.total)}`,
      sub: `價格 ${spyPx} <span class="tag ${spy.cumRet >= 0 ? "pos" : "neg"}">${fmtPct(spy.cumRet)}</span>`
    }
  ];

  document.getElementById("kpi-row").innerHTML = cards.map(c => `
    <div class="card">
      <div class="kpi-label"><span>${c.label}</span>${c.badge}</div>
      <div class="kpi-val">${c.val}</div>
      <div class="kpi-sub">${c.sub}</div>
    </div>
  `).join("");
}

function renderLineChart(M) {
  const svg = document.getElementById("line-svg");
  const tt = document.getElementById("line-tt");
  const W = 680, H = 290, pad = { t: 20, r: 24, b: 36, l: 58 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;

  const visibleVals = [];
  M.ids.forEach(id => {
    if (!STATE.hidden.has(id)) M.series[id].forEach(p => visibleVals.push(p.total));
  });
  if (!STATE.hidden.has("SPY")) M.spySeries.forEach(p => visibleVals.push(p.total));
  if (!visibleVals.length) visibleVals.push(9800, 10200);

  let minV = Math.min(...visibleVals, 9800);
  let maxV = Math.max(...visibleVals, 10200);
  const span = maxV - minV || 400;
  minV -= span * 0.12;
  maxV += span * 0.12;

  const rawStep = (maxV - minV) / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  minV = Math.floor(minV / step) * step;
  maxV = Math.ceil(maxV / step) * step;

  const n = M.rounds.length;
  const xAt = i => pad.l + (n === 1 ? pw / 2 : (i / (n - 1)) * pw);
  const yAt = v => pad.t + ((maxV - v) / (maxV - minV)) * ph;

  let out = "";
  // Grid lines
  const ticks = Math.round((maxV - minV) / step);
  for (let i = 0; i <= ticks; i++) {
    const v = minV + i * step;
    const y = yAt(v);
    out += `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}" stroke="var(--border)" stroke-dasharray="3,4"/>`;
    out += `<text x="${pad.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v).toLocaleString()}</text>`;
  }
  // 10000 baseline
  if (10000 >= minV && 10000 <= maxV) {
    const y0 = yAt(10000);
    out += `<line x1="${pad.l}" y1="${y0}" x2="${W - pad.r}" y2="${y0}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5,4" opacity="0.6"/>`;
  }

  // Selected round highlight band
  if (STATE.roundIdx >= 0) {
    const sx = xAt(STATE.roundIdx);
    out += `<line x1="${sx}" y1="${pad.t}" x2="${sx}" y2="${H - pad.b}" stroke="var(--accent)" stroke-width="1.5" opacity="0.45"/>`;
  }

  // X labels
  M.rounds.forEach((r, i) => {
    const x = xAt(i);
    const active = STATE.roundIdx === i;
    out += `<text x="${x}" y="${H - 12}" text-anchor="middle" font-size="11.5" font-weight="${active ? 800 : 600}" fill="${active ? "var(--text)" : "var(--muted)"}">R${i + 1} (${r.date.slice(5)})</text>`;
  });

  // SPY line
  if (!STATE.hidden.has("SPY")) {
    const pts = M.spySeries.map((p, i) => `${xAt(i)},${yAt(p.total)}`).join(" ");
    out += `<polyline fill="none" stroke="var(--c-spy)" stroke-width="2" stroke-dasharray="6,4" points="${pts}"/>`;
    M.spySeries.forEach((p, i) => {
      out += `<circle cx="${xAt(i)}" cy="${yAt(p.total)}" r="3.5" fill="var(--surface)" stroke="var(--c-spy)" stroke-width="2"/>`;
    });
  }

  // AI lines
  M.ids.forEach(id => {
    if (STATE.hidden.has(id)) return;
    const col = getColor(id);
    const pts = M.series[id].map((p, i) => `${xAt(i)},${yAt(p.total)}`).join(" ");
    out += `<polyline fill="none" stroke="${col}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>`;
    M.series[id].forEach((p, i) => {
      const r = STATE.roundIdx === i ? 5.5 : 4;
      out += `<circle cx="${xAt(i)}" cy="${yAt(p.total)}" r="${r}" fill="var(--surface)" stroke="${col}" stroke-width="2.5"/>`;
    });
  });

  // Hover column overlay
  out += `<line id="hover-line" x1="0" y1="${pad.t}" x2="0" y2="${H - pad.b}" stroke="var(--text)" stroke-width="1" opacity="0"/>`;
  M.rounds.forEach((r, i) => {
    const colW = pw / Math.max(1, n - 1);
    const rx = i === 0 ? pad.l : xAt(i) - colW / 2;
    const rw = (i === 0 || i === n - 1) ? colW / 2 : colW;
    out += `<rect class="hover-zone" data-idx="${i}" x="${rx}" y="${pad.t}" width="${rw}" height="${ph}" fill="transparent" style="cursor:pointer"/>`;
  });

  svg.innerHTML = out;
  const hLine = svg.querySelector("#hover-line");
  svg.querySelectorAll(".hover-zone").forEach(zone => {
    zone.addEventListener("mouseenter", () => {
      const i = Number(zone.dataset.idx);
      const x = xAt(i);
      hLine.setAttribute("x1", x);
      hLine.setAttribute("x2", x);
      hLine.setAttribute("opacity", "0.28");
      const rows = [];
      M.ids.forEach(id => {
        if (!STATE.hidden.has(id)) {
          const p = M.series[id][i];
          rows.push({ name: id, color: getColor(id), total: p.total, ret: p.cumRet });
        }
      });
      if (!STATE.hidden.has("SPY")) {
        const sp = M.spySeries[i];
        rows.push({ name: "SPY 基準", color: "var(--c-spy)", total: sp.total, ret: sp.cumRet });
      }
      rows.sort((a, b) => b.total - a.total);
      tt.innerHTML = `
        <div class="tt-head"><span>R${i + 1} · ${M.rounds[i].date}</span><span>點擊鎖定</span></div>
        ${rows.map(r => `
          <div class="tt-row">
            <span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:${r.color}"></span>${r.name}</span>
            <span><strong>${fmt(r.total)}</strong> <small style="color:${r.ret >= 0 ? "var(--pos)" : "var(--neg)"}">(${fmtPct(r.ret)})</small></span>
          </div>
        `).join("")}
      `;
      tt.style.display = "block";
      const leftPct = (x / W) * 100;
      tt.style.left = leftPct > 58 ? "auto" : `calc(${leftPct}% + 12px)`;
      tt.style.right = leftPct > 58 ? `calc(${100 - leftPct}% + 12px)` : "auto";
      tt.style.top = "14px";
    });
    zone.addEventListener("mouseleave", () => {
      hLine.setAttribute("opacity", "0");
      tt.style.display = "none";
    });
    zone.addEventListener("click", () => {
      const i = Number(zone.dataset.idx);
      STATE.roundIdx = i;
      STATE.matrixIdx = i;
      renderAll();
    });
  });
}

function renderBarChart(M) {
  const tabs = document.getElementById("subchart-tabs");
  tabs.querySelectorAll("button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === STATE.subTab);
    b.onclick = () => { STATE.subTab = b.dataset.tab; renderBarChart(M); };
  });

  const svg = document.getElementById("bar-svg");
  const W = 440, H = 290;
  const idx = STATE.roundIdx >= 0 ? STATE.roundIdx : M.lastIdx;
  const rows = M.ids.map(id => ({ id, ...M.series[id][idx] })).sort((a, b) => b.total - a.total);

  let out = "";
  if (STATE.subTab === "risk") {
    const padL = 74, padR = 54, top = 34, rowH = 56;
    out += `<text x="${padL}" y="18" font-size="11" font-weight="700" fill="var(--muted)">上條：累積報酬率%　｜　下條：最大回撤 MDD%</text>`;
    const maxScale = Math.max(10, ...rows.map(r => Math.max(Math.abs(r.cumRet * 100), Math.abs(r.mdd * 100)) * 1.15));
    const barW = W - padL - padR;
    rows.forEach((r, i) => {
      const y = top + i * rowH;
      const retPct = r.cumRet * 100;
      const mddPct = Math.abs(r.mdd * 100);
      const wRet = Math.min(barW, (Math.abs(retPct) / maxScale) * barW);
      const wMdd = Math.min(barW, (mddPct / maxScale) * barW);
      out += `<text x="6" y="${y + 22}" font-size="12.5" font-weight="800" fill="${getColor(r.id)}">${r.id}</text>`;
      // Ret bar
      out += `<rect x="${padL}" y="${y + 4}" width="${Math.max(4, wRet)}" height="13" rx="4" fill="${retPct >= 0 ? "var(--pos)" : getColor(r.id)}" opacity="0.9"/>`;
      out += `<text x="${padL + Math.max(4, wRet) + 6}" y="${y + 15}" font-size="11.5" font-weight="700" fill="var(--text)">${retPct >= 0 ? "+" : ""}${fmt(retPct)}%</text>`;
      // MDD bar
      out += `<rect x="${padL}" y="${y + 22}" width="${Math.max(4, wMdd)}" height="13" rx="4" fill="var(--muted)" opacity="0.35"/>`;
      out += `<text x="${padL + Math.max(4, wMdd) + 6}" y="${y + 33}" font-size="11.5" fill="var(--muted)">MDD -${fmt(mddPct)}%</text>`;
    });
  } else {
    const padL = 74, padR = 64, top = 34, rowH = 56;
    out += `<text x="${padL}" y="18" font-size="11" font-weight="700" fill="var(--muted)">上條：總名目曝險倍數　｜　下條：現金比例% (上限 50%)</text>`;
    const barW = W - padL - padR;
    rows.forEach((r, i) => {
      const y = top + i * rowH;
      const wLev = Math.min(barW, (r.effLev / 2.4) * barW);
      const wCash = Math.min(barW, (r.cashPct / 0.6) * barW);
      const x50 = padL + (0.5 / 0.6) * barW;
      out += `<text x="6" y="${y + 22}" font-size="12.5" font-weight="800" fill="${getColor(r.id)}">${r.id}</text>`;
      out += `<rect x="${padL}" y="${y + 4}" width="${Math.max(4, wLev)}" height="13" rx="4" fill="${getColor(r.id)}"/>`;
      out += `<text x="${padL + Math.max(4, wLev) + 6}" y="${y + 15}" font-size="11.5" font-weight="700" fill="var(--text)">${fmt(r.effLev)}x</text>`;
      out += `<rect x="${padL}" y="${y + 22}" width="${Math.max(4, wCash)}" height="13" rx="4" fill="#64748b" opacity="0.45"/>`;
      out += `<line x1="${x50}" y1="${y + 20}" x2="${x50}" y2="${y + 37}" stroke="var(--neg)" stroke-dasharray="2,2" stroke-width="1.2"/>`;
      out += `<text x="${padL + Math.max(4, wCash) + 6}" y="${y + 33}" font-size="11.5" fill="var(--muted)">現金 ${fmt(r.cashPct * 100, 1)}%</text>`;
    });
  }
  svg.innerHTML = out;
}

function renderMarketStrip(M) {
  const idx = STATE.roundIdx >= 0 ? STATE.roundIdx : M.lastIdx;
  const r = M.rounds[idx];
  const prev = idx > 0 ? M.rounds[idx - 1] : null;
  const base = M.rounds[0];
  const syms = ["SPY", "QQQ", "EWT", "EWY"];

  const chips = syms.map(sym => {
    const px = r.prices[sym];
    const chg = prev ? (px / prev.prices[sym] - 1) : (px / base.prices[sym] - 1);
    const cum = px / base.prices[sym] - 1;
    const showVal = STATE.roundIdx === -1 ? cum : chg;
    const label = STATE.roundIdx === -1 ? "4輪累計" : (idx === 0 ? "基準" : "單日");
    return `<div class="etf-chip">
      <div class="sym">${sym} · ${label}</div>
      <div class="px">
        <span>${fmt(px)}</span>
        <span class="tag ${showVal >= 0 ? "pos" : "neg"}" style="font-size:10.5px">${idx === 0 && STATE.roundIdx === 0 ? "0.00%" : fmtPct(showVal)}</span>
      </div>
    </div>`;
  }).join("");

  const noteText = ROUND_NOTES[r.date] || `第 ${idx + 1} 回合報價基準（${r.date}）`;
  document.getElementById("market-strip").innerHTML = `
    <div class="etf-pills">${chips}</div>
    <div class="event-line"><strong>${STATE.roundIdx === -1 ? "全期市場脈絡" : `R${idx + 1} (${r.date}) 重點`}：</strong>${STATE.roundIdx === -1 ? "先漲後跌路徑——R2 反彈後，R3 爆出輝達 CEO 辭任、R4 遇 PPI 升溫與 10 年債破 5.15%，高槓桿部位承壓。" : esc(noteText)}</div>
  `;
}

function renderAICards(M) {
  const box = document.getElementById("ai-grid");
  box.innerHTML = M.standings.map((s, rankIdx) => {
    const meta = AI_META[s.id] || { color: "#6366f1", style: s.entry?.strategy_name || "自訂策略", pros: "—", cons: "—" };
    const seq = M.series[s.id].map((x, i) => {
      const adj = x.action === "調整";
      return `<span class="act-dot ${adj ? "adj" : ""}">R${i + 1}${adj ? "調" : "守"}</span>`;
    }).join("");
    return `
      <div class="card ai-card" style="--ai-color:${meta.color}">
        <div class="ai-top">
          <div>
            <div class="ai-id">
              <span class="rank-badge ${rankIdx === 0 ? "rank-1" : ""}">第 ${rankIdx + 1} 名</span>
              <span>${s.id}</span>
            </div>
            <div class="subtitle" style="margin-top:3px">${esc(meta.style)}</div>
          </div>
          <span class="tag ${s.cumRet >= 0 ? "pos" : "neg"}">${fmtPct(s.cumRet)}</span>
        </div>

        <div class="ai-metrics">
          <div class="ai-m"><span>最終總值</span><strong>${fmt(s.total)}</strong></div>
          <div class="ai-m"><span>相對 SPY</span><strong style="color:${s.excess >= 0 ? "var(--pos)" : "var(--neg)"}">${fmtPct(s.excess)}</strong></div>
          <div class="ai-m"><span>最大回撤</span><strong>${fmt(s.mdd * 100)}%</strong></div>
          <div class="ai-m"><span>R4 曝險/現金</span><strong>${fmt(s.effLev)}x / ${fmt(s.cashPct * 100, 0)}%</strong></div>
        </div>

        <ul class="ai-points">
          <li><strong>亮點：</strong>${esc(meta.pros)}</li>
          <li><strong>盲點：</strong>${esc(meta.cons)}</li>
        </ul>

        <div class="ai-foot">
          <div class="action-seq" title="各回合動作">${seq}</div>
          <button class="btn" onclick="openDetail('${s.id}')">查看回合明細 →</button>
        </div>
      </div>
    `;
  }).join("");
}

function renderMatrix(M) {
  const tabs = document.getElementById("matrix-tabs");
  tabs.innerHTML = M.rounds.map((r, i) =>
    `<button class="pill ${STATE.matrixIdx === i ? "active" : ""}" data-mi="${i}">R${i + 1} (${r.date.slice(5)})</button>`
  ).join("");
  tabs.querySelectorAll("button").forEach(b => {
    b.onclick = () => { STATE.matrixIdx = Number(b.dataset.mi); renderMatrix(M); };
  });

  const idx = STATE.matrixIdx;
  const r = M.rounds[idx];
  document.getElementById("matrix-title").textContent = `R${idx + 1} (${r.date}) 持倉結構與調倉重點`;

  const ranked = M.ids.map(id => M.series[id][idx]).sort((a, b) => b.total - a.total);
  document.getElementById("matrix-list").innerHTML = ranked.map(s => {
    const segs = s.positions.map(p => {
      const w = (p.principal / s.total) * 100;
      const col = SYM_COLORS[p.sym] || "#64748b";
      return `<div class="alloc-seg" style="width:${w}%;background:${col}" title="${p.sym}*${p.lev}: ${fmt(p.principal)} (${fmt(w,1)}%)">
        ${w > 11 ? `${p.sym}*${p.lev} ${fmt(w,0)}%` : ""}
      </div>`;
    }).join("");
    const cw = (s.cash / s.total) * 100;
    const cashSeg = cw > 0.1 ? `<div class="alloc-seg cash" style="width:${cw}%" title="現金: ${fmt(s.cash)} (${fmt(cw,1)}%)">
      ${cw > 11 ? `現金 ${fmt(cw,0)}%` : ""}
    </div>` : "";

    const summary = ROUND_DISTILLED[r.date]?.[s.id] || (s.entry?.trades || "").slice(0, 68);
    const isAdj = s.action === "調整";
    return `
      <div class="matrix-row">
        <div>
          <div style="font-weight:800;display:flex;align-items:center;gap:6px">
            <span class="dot" style="background:${getColor(s.id)}"></span>${s.id}
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">
            總值 ${fmt(s.total)} · ${fmt(s.effLev)}x
          </div>
        </div>
        <div>
          <div class="alloc-bar">${segs}${cashSeg}</div>
          <div class="alloc-meta">
            <span class="tag ${isAdj ? "warn" : ""}">${esc(s.action)}</span>
            <span>${esc(summary)}</span>
          </div>
        </div>
        <div>
          <button class="btn" onclick="openDetail('${s.id}', ${idx})">原文</button>
        </div>
      </div>
    `;
  }).join("");
}

function renderAudit(M) {
  // Dynamic math check
  let maxMathDiff = 0;
  let cashViolation = 0;
  M.ids.forEach(id => {
    for (let i = 1; i < M.rounds.length; i++) {
      const prev = M.series[id][i - 1];
      const cur = M.series[id][i];
      const p0 = M.rounds[i - 1].prices;
      const p1 = M.rounds[i].prices;
      let exp = prev.cash;
      prev.positions.forEach(p => {
        const ret = p1[p.sym] / p0[p.sym] - 1;
        exp += Math.max(0, p.principal * (1 + p.lev * ret));
      });
      maxMathDiff = Math.max(maxMathDiff, Math.abs(cur.total - exp));
      if (cur.cashPct > 0.50005) cashViolation++;
    }
  });

  document.getElementById("audit-grid").innerHTML = `
    <div class="card">
      <h3 class="card-title" style="margin-bottom:10px">✅ 大會硬性規則（全數合規）</h3>
      <ul class="audit-list">
        <li><span class="tag pos">通過</span><span><strong>標的與槓桿</strong>：僅交易 SPY/QQQ/EWT/EWY，槓桿皆在 2x–3x（符合 2–10x）。</span></li>
        <li><span class="tag pos">通過</span><span><strong>現金上限 ≤ 50%</strong>：共 ${cashViolation} 次調倉後越線（AI-mm 於 R4 主動補買 SPY*2 修復）。</span></li>
        <li><span class="tag pos">通過</span><span><strong>數學結算精度</strong>：逐回合重算最大誤差僅 <strong>${fmt(maxMathDiff, 4)}</strong> 單位（純四捨五入尾差）。</span></li>
      </ul>
    </div>
    <div class="card">
      <h3 class="card-title" style="margin-bottom:10px">⚠️ 自我規範落差與文字瑕疵</h3>
      <ul class="audit-list">
        <li><span class="tag warn">注意</span><span><strong>AI-gr 自訂下限矛盾</strong>：R1 策略聲明現金不低於 30%，但 R1 (25.0%)、R2 (23.2%) 連續未達標。</span></li>
        <li><span class="tag warn">筆誤</span><span><strong>AI-mm R3 備註誤植</strong>：note 欄將 EWY 價格誤寫為前一回合的 149.45（實際應為 145.94，結算無誤）。</span></li>
        <li><span class="tag">格式</span><span><strong>策略欄位留空</strong>：AI-cd、AI-gr (R2–R4) 與 AI-ds (R4) 未重填 strategy 欄位（僅 AI-mm 全程完整）。</span></li>
      </ul>
    </div>
  `;
}

window.openDetail = function(id, focusIdx = -1) {
  const M = computeModel(RAW);
  const modal = document.getElementById("detail-modal");
  document.getElementById("modal-title").innerHTML =
    `<span style="display:inline-flex;align-items:center;gap:8px"><span class="dot" style="background:${getColor(id)}"></span>${id} 逐回合決策與原文紀錄</span>`;

  const blocks = M.series[id].map((s, i) => {
    const posStr = s.positions.map(p => `${p.sym}*${p.lev}: ${fmt(p.principal)}`).join("、");
    const openAttr = (focusIdx === i) ? "open" : "";
    const sum = ROUND_DISTILLED[s.date]?.[id] || "";
    return `
      <div class="round-block" style="${focusIdx === i ? `border-color:${getColor(id)}` : ""}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <strong>R${i + 1} (${s.date}) · ${esc(s.action)}</strong>
          <span>總值 <strong>${fmt(s.total)}</strong> (${fmtPct(s.cumRet)}) · 現金 ${fmt(s.cash)} (${fmt(s.cashPct * 100, 1)}%)</span>
        </div>
        <div style="font-size:12.5px;margin-top:4px">持倉：${esc(posStr || "無")}</div>
        ${sum ? `<div style="font-size:12.5px;color:var(--accent);margin-top:4px"><strong>重點：</strong>${esc(sum)}</div>` : ""}
        <details ${openAttr}>
          <summary>展開完整原文（事實 / 判斷 / 交易 / 策略）</summary>
          <div class="raw-txt"><strong>【交易】</strong>${esc(s.entry?.trades)}\n\n<strong>【判斷】</strong>${esc(s.entry?.judgment)}\n\n<strong>【事實】</strong>${esc(s.entry?.facts)}${s.entry?.strategy ? `\n\n<strong>【策略】</strong>${esc(s.entry.strategy)}` : ""}</div>
        </details>
      </div>
    `;
  }).join("");

  document.getElementById("modal-body").innerHTML = blocks;
  modal.showModal();
};

document.getElementById("modal-close").onclick = () => document.getElementById("detail-modal").close();
document.getElementById("detail-modal").addEventListener("click", e => {
  if (e.target === e.currentTarget) e.currentTarget.close();
});

document.getElementById("theme-btn").onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
};

document.getElementById("file-in").addEventListener("change", e => {
  const f = e.target.files?.[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const parsed = JSON.parse(String(rd.result));
      if (!Array.isArray(parsed.rounds) || !Array.isArray(parsed.ids)) throw new Error("非競賽 JSON 格式");
      RAW = parsed;
      STATE.roundIdx = -1;
      STATE.matrixIdx = parsed.rounds.length - 1;
      renderAll();
    } catch (err) {
      alert("匯入失敗：" + err.message);
    }
  };
  rd.readAsText(f, "utf-8");
});

renderAll();
</script>
</body>
